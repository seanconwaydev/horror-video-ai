# Per-stage model configuration.
#
# Each key is a pipeline stage (see docs/pipeline.md). The model string
# must be in LiteLLM's "<provider>/<model-name>" format.
#
# Per docs/decisions/0003-model-configuration-via-litellm.md: these are
# pinned on purpose. Change a model only by editing this file by hand --
# never automatically, never via a fallback/router.

# v1 stages (see docs/decisions/0006 and 0007) -- real decisions, not placeholders.
# previz is the exception -- see docs/decisions/0011-previz-image-model-for-
# video-aspect-ratio-fit.md for why it moved off the original 0007 placeholder.

research:
  model: "perplexity/sonar-deep-research"

# gemini-2.5-flash was retired by Google (real 404: "no longer available
# to new users") -- moved to gemini-3.6-flash, Google's own suggested
# replacement, verified working. See docs/decisions/0018.
fact_check:
  model: "gemini/gemini-3.6-flash"

previz:
  model: "gemini/gemini-2.5-flash-image"

# previz_review: adversarial check on previz's *output image*, not a
# pipeline.md-numbered stage of its own -- see docs/decisions/0009-previz-
# image-review.md. Vision-capable, deliberately a different provider than
# previz's own OpenAI image model, same "not the same model checking its
# own work" reasoning as fact_check vs. research (0007). Picked the same
# way previz's own model was in 0007 -- to unblock building this, not a
# rigorously compared decision.

previz_review:
  model: "anthropic/claude-sonnet-5"

# video_generation: stage 9. Picked to unblock building the stage, not a
# rigorously compared decision -- see docs/decisions/0010-video-generation-
# model-and-standalone-stage.md. Uses the same OPENAI_API_KEY already
# required for previz's image model; whether this OpenAI account actually
# has Sora API access is unverified until a real run is tried. Veo (Google,
# via Vertex AI) is a real candidate to compare against next, per that ADR.

video_generation:
  model: "openai/sora-2"

# Deferred stages (docs/decisions/0006): skipped for v1, not deleted -- these
# stay as placeholders so the full pipeline vision in docs/pipeline.md still
# has a config slot waiting for it. Untouched, still "anthropic/claude-sonnet-5"
# from initial scaffolding -- revisit when these stages are actually built.

narrative:
  model: "anthropic/claude-sonnet-5"

narrative_review:
  model: "anthropic/claude-sonnet-5"

shot_list:
  model: "anthropic/claude-sonnet-5"

video_prompts:
  model: "anthropic/claude-sonnet-5"

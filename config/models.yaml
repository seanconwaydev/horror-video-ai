# Per-stage model configuration.
#
# Each key is a pipeline stage (see docs/pipeline.md). The model string
# must be in LiteLLM's "<provider>/<model-name>" format.
#
# Per docs/decisions/0003-model-configuration-via-litellm.md: these are
# pinned on purpose. Change a model only by editing this file by hand --
# never automatically, never via a fallback/router.
#
# Only stages that have code get a pin (docs/decisions/0063). A stage
# nobody has written yet gets its pin when its module is written, not
# before -- an unvalidatable pin goes stale silently, and this project has
# already had a pinned model retired underneath it (docs/decisions/0018).

# v1 stages (see docs/decisions/0006 and 0007) -- real decisions, not placeholders.
# previz is the exception -- see docs/decisions/0011-previz-image-model-for-
# video-aspect-ratio-fit.md for why it moved off the original 0007 placeholder.

research:
  model: "perplexity/sonar-deep-research"

# gemini-2.5-flash was retired by Google (real 404: "no longer available
# to new users") -- moved to gemini-3.6-flash, Google's own suggested
# replacement, verified working. See docs/decisions/0018.
fact_check:
  model: "gemini/gemini-3.6-flash"

# scene_planning: inserted between fact-check and previz, not yet wired
# into image generation -- see docs/decisions/0023-scene-planning-stage.md.
# Turns a verified fact sheet into a full plan (characters, locations,
# beats) before any image generation happens. DeepSeek picked to unblock
# building the stage, not a rigorously compared decision, same status as
# every other stage's initial model choice in this project.

scene_planning:
  model: "deepseek/deepseek-v4-flash"

previz:
  model: "gemini/gemini-2.5-flash-image"

# previz_review: adversarial check on previz's *output image*, not a
# pipeline.md-numbered stage of its own -- see docs/decisions/0009-previz-
# image-review.md. Vision-capable, deliberately a different provider than
# previz's own OpenAI image model, same "not the same model checking its
# own work" reasoning as fact_check vs. research (0007). Picked the same
# way previz's own model was in 0007 -- to unblock building this, not a
# rigorously compared decision.

previz_review:
  model: "anthropic/claude-sonnet-5"

# video_generation: stage 9. Wan 2.2 (Alibaba's open-weight model) hosted
# on Replicate -- see docs/decisions/0037 for why this moved off
# openai/sora-2 (Sora's API was removed 2026-09-24, and its moderation was
# a structurally bad fit for horror) and docs/decisions/0038 for the
# implementation.
#
# NOT a LiteLLM string: the "replicate/" prefix marks the one stage that
# bypasses litellm entirely (litellm has no Replicate video support), and
# stages/video_generation.py strips it to get the bare "owner/name" model
# slug Replicate's own API expects. Requires REPLICATE_API_TOKEN.

video_generation:
  model: "replicate/wan-video/wan-2.2-i2v-fast"

# moderation_check: a free, advisory pre-flight on every video-generation
# call -- OpenAI's own omni-moderation-latest endpoint via
# litellm.moderation(), the only model it supports today.
#
# It no longer blocks anything. Its original partner layer
# (moderation_review, a paid vision call guessing at Sora's own
# moderation behaviour) was deleted in docs/decisions/0038 along with
# Sora itself: Wan has no vendor-baked safety alignment to predict, so
# that layer could only ever produce false positives. What remains is
# kept purely as a YouTube-policy signal for the human reviewing a run,
# not as a gate -- horror content is expected to trip its violence
# category routinely.

moderation_check:
  model: "openai/omni-moderation-latest"

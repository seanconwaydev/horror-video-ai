[project]
name = "historical-video-ai"
version = "0.1.0"
description = "AI pipeline for generating historical educational YouTube videos, stage by stage with human review gates."
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "pyyaml",
    "python-dotenv",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
historical-video-ai = "historical_video_ai.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

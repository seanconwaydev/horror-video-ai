[project]
name = "historical-video-ai"
version = "0.1.0"
description = "AI pipeline for generating historical educational YouTube videos, stage by stage with human review gates."
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.98.0",
    "pyyaml",
    "python-dotenv",
    "pillow",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
historical-video-ai = "historical_video_ai.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "ANN001", # missing type annotation for a function argument
    "ANN201", # missing return type annotation for a public function
    "ANN202", # missing return type annotation for a private function
]

[tool.ruff.lint.per-file-ignores]
# Tests aren't held to this -- pytest fixtures (tmp_path, monkeypatch, ...)
# are conventionally left unannotated, and every test function returns
# None, which would be pure noise to write out on every one of them.
"tests/*" = ["ANN001", "ANN201", "ANN202"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# A floor, not a target: it exists to stop coverage sliding, not to chase
# a number. Raised as each seam comes out of the old cli.py -- moving code
# changes no coverage number by itself, but a module small enough to test
# on its own gets tested, and the floor follows. Every stage module is at
# 95-100%; effectively all of the uncovered code is in cli/app.py.
[tool.coverage.run]
source = ["src/historical_video_ai"]

[tool.coverage.report]
fail_under = 86
show_missing = true

# ruff's ANN rules enforce that annotations *exist*; nothing checked they
# were *true*, so the project paid the cost of writing them without
# collecting the benefit. Turning mypy on found 25 errors, including a
# `Callable[[list[str]], PrevizResult]` whose function actually returned a
# list -- seven cascading errors from one wrong annotation, in code whose
# own body called len() on the "single" result.
#
# src/ only. tests/ is exempt from the ANN rules for the same reason
# (pytest fixtures are conventionally unannotated), so checking it would
# be noise.
[tool.mypy]
files = ["src", "evals", "tests"]
python_version = "3.11"

# litellm ships no usable types for its response objects. Stage code
# validates their shape at runtime -- getattr, try/except, then a
# <Stage>Error -- which is the real contract; a stricter annotation here
# would be a guess dressed as a guarantee.
[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true

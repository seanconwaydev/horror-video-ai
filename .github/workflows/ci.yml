# Runs the checks that already exist in this repo but were opt-in until now.
#
# The point is enforcement across a boundary, not discovery: the repo's
# documented failure mode is a convention that holds until someone
# (frequently a fresh Claude Code session with no memory of the one that
# wrote the rule) misses it, ships a green-looking change, and nothing
# notices for weeks -- see docs/playbook/repo-audit-brief.md.
#
# Nothing here spends money or needs a key. Every job is offline: --mock
# for the pipeline, --dry-run for the eval scripts.
name: CI

# Every branch, not just main and open PRs. A branch with no PR matched
# neither trigger before, so five commits (ADRs 0054-0056, the mypy
# expansion, the coverage floor) shipped with zero CI runs while being
# reported as verified -- exactly the failure mode this workflow exists
# to catch.
#
# A branch that also has a PR open now runs twice, once per event. That
# is deliberate: the `pull_request` run tests the merge with main, which
# the `push` run does not, and the concurrency groups below are keyed on
# `github.ref` -- distinct per event (`refs/heads/x` vs
# `refs/pull/N/merge`), so the two never cancel each other. Cancelling
# the duplicate would leave a "Cancelled" check sitting on every PR, and
# a check nobody can read at a glance is the thing this repo keeps
# getting wrong.
on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run's answer obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen rather than a plain sync: it fails if uv.lock is out of
      # date with pyproject.toml, which matters here because CLAUDE.md
      # documents litellm workarounds verified against one specific
      # version while pyproject declares litellm with no constraint at
      # all. The lockfile is what actually pins it, so drift between the
      # two is worth failing on.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      # Includes test_docs_links.py (every relative markdown link
      # resolves) and test_adr_supersession.py (an ADR that supersedes
      # another is linked from both ends). Both exist to catch a future
      # session's omission, and both are useless unless something runs
      # them on a change that omits it.
      - name: Tests
        run: uv run pytest

      # Blocking from the start rather than advisory: the codebase is at
      # zero errors as of this commit, so there is no backlog to wade
      # through and nothing to grandfather in. An advisory type check in a
      # repo whose failure mode is "the guard existed and nobody ran it"
      # would be the same mistake in a new place.
      - name: Types
        run: uv run mypy

      # A floor to stop coverage sliding, not a target to chase. What it
      # does not see: main(), which the smoke job below runs end to end
      # but not under coverage.
      - name: Coverage
        run: uv run pytest --cov --cov-report=term-missing

  smoke:
    name: offline smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # pytest's testpaths is ["tests"], and nothing under tests/ imports
      # anything under evals/ -- so the entire measurement layer had zero
      # automated coverage. That is why the eval harness sat broken for a
      # month: ADR 0045 deleted Beat.cinematography, the committed
      # anchor_scene.json kept it, and Beat(**beat) raised TypeError on
      # the repo's own fixture with nothing to notice. These dry-runs
      # would have failed the day the field was deleted.
      #
      # motion_test.py is deliberately absent: it takes a previous run's
      # images as its input and globs evals/results/, which is gitignored.
      # It passes locally, where results from earlier runs exist, and fails
      # in a clean checkout -- which is what happened on this workflow's
      # first run. It has no smoke coverage as a result; covering it would
      # mean committing image fixtures.
      - name: Eval scripts still import and parse their fixtures
        run: |
          set -e
          for script in camera_obedience conditioning_bakeoff \
                        reference_anchor run_eval; do
            echo "--- $script"
            uv run python "evals/$script.py" --dry-run
          done

      # No --dry-run flag because it never calls a model at all; it reads
      # finished run logs. Exercised here so a change to the run-log shape
      # cannot silently break the judgement dataset (docs/decisions/0053).
      - name: Judgement export runs
        run: uv run python evals/export_judgements.py

      # The pipeline end to end with no network and no keys. Covers the
      # wiring between stages, which no unit test spans.
      - name: Pipeline runs offline
        run: |
          uv run historical-video-ai --mock --yes \
            --genre horror --tone dread --candidates 2 --max-beats 2 \
            --time "present day" --place "an underground car park at night" \
            --description "a woman notices someone standing between the pillars"

      # Stage 9 is a separate invocation by design (docs/decisions/0010),
      # so the run above never reaches it. It reads a finished run
      # directory back off disk, which is exactly what the previous step
      # just produced -- the one place the two halves meet is the run-log
      # shape, and nothing else checks that they still agree.
      - name: Video generation runs offline against that run
        run: |
          set -e
          run_dir=$(ls -d outputs/run_* | head -1)
          echo "--- $run_dir"
          uv run historical-video-ai --mock --yes --video-gen-from "$run_dir"
